<body>
    <div class="container-fluid py-5">
        <div class="container">
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="search-card p-4 shadow">
                        <div class="row">
                            <div class="col-md-5">
                                <div class="form-group">
                                    <label class="font-weight-bold">Departure From</label>
                                    <input type="text" id="departure" class="form-control" 
                                           placeholder="Start typing (e.g., CBD Belapur)" 
                                           oninput="searchStations('departure')">
                                    <div id="departureSuggestions" class="suggestions"></div>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <div class="form-group">
                                    <label class="font-weight-bold">Destination To</label>
                                    <input type="text" id="destination" class="form-control" 
                                           placeholder="Start typing (e.g., Karjat)" 
                                           oninput="searchStations('destination')">
                                    <div id="destinationSuggestions" class="suggestions"></div>
                                </div>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary btn-block" onclick="findBuses()">Search</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="card results-card shadow">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0">Available Bus Routes</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="list-group" id="busResults"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div id="map" class="map-container shadow"></div>
                    <div id="routeInfo" class="mt-3 p-3 bg-light rounded"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // Extended NMMT Bus Stops Data
        const nmmtStops = [
    {"name": "Bhingari", "lat": 18.9900, "lng": 73.1100},
    {"name": "Bhingarwadi", "lat": 18.9500, "lng": 73.1800},
    {"name": "CBD Belapur", "lat": 19.0222, "lng": 73.0395},
    {"name": "Chhatrapati Shivaji Maharaj University", "lat": 18.9494, "lng": 73.1762},
    {"name": "Chikhale Gaon", "lat": 18.9000, "lng": 73.1500},
    {"name": "Derivali", "lat": 18.8500, "lng": 73.2000},
    {"name": "Hotel Rahul Park", "lat": 18.9900, "lng": 73.1200},
    {"name": "Karjat", "lat": 18.9100, "lng": 73.3235},
    {"name": "Khandacolony", "lat": 19.0000, "lng": 73.1000},
    {"name": "Kharghar", "lat": 19.0330, "lng": 73.0700},
    {"name": "Khopoli", "lat": 18.7856, "lng": 73.3451},
    {"name": "Kolkhe Gaon", "lat": 18.9500, "lng": 73.1000},
    {"name": "Kon Gaon", "lat": 19.2000, "lng": 73.1500},
    {"name": "MGM College", "lat": 19.0300, "lng": 73.0700},
    {"name": "National Residency", "lat": 18.9800, "lng": 73.1100},
    {"name": "O.N.G.C. Kalundre", "lat": 18.9800, "lng": 73.1300},
    {"name": "Orion Mall Panvel", "lat": 18.9900, "lng": 73.1200},
    {"name": "Palaspe Phata", "lat": 18.9500, "lng": 73.1100},
    {"name": "Panvel", "lat": 18.9894, "lng": 73.1175},
    {"name": "Panvel Bus Station / Shivajinagar", "lat": 18.9900, "lng": 73.1200},
    {"name": "Panvel Station Chowk", "lat": 18.9900, "lng": 73.1200},
    {"name": "Raigad Petrol Pump Ajivali", "lat": 18.9500, "lng": 73.1500},
    {"name": "Shedung", "lat": 18.9500, "lng": 73.1800},
    {"name": "Shree Panchmukhi Hanuman Mandir", "lat": 18.9800, "lng": 73.1200},
    {"name": "Takka Gaon Chowk", "lat": 18.9900, "lng": 73.1100},
    {"name": "Thane", "lat": 19.2183, "lng": 72.9781},
    {"name": "Thobrewadi", "lat": 18.9500, "lng": 73.1800}  
        ];

        // Enhanced Bus Routes Data
        const busRoutes = {
            "NMMT 101": {
                stops: ["CBD Belapur Station", "Vashi Station", "Sanpada Station", "Nerul Station"],
                timings: ["06:00", "07:30", "09:00", "10:30", "12:00", "13:30", "15:00", "16:30", "18:00", "19:30", "21:00"],
                frequency: "Every 30 minutes"
            },
            "NMMT 202": {
                stops: ["Karjat Station", "Panvel Station", "Kharghar Station", "CBD Belapur Station"],
               timings: ["05:00", "06:30", "08:00", "09:30", "11:00", "12:30", "14:00", "15:30", "17:00", "18:30", "20:00", "21:30"],
                frequency: "Every 1.5 hours"
            }
        };

        let map;
        let routingControl;

        function initMap() {
            // Initialize Leaflet map centered on Navi Mumbai
            map = L.map('map').setView([19.0330, 73.0156], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Add markers for all NMMT stops
            nmmtStops.forEach(stop => {
                L.marker([stop.lat, stop.lng])
                    .bindPopup(`<b>${stop.name}</b>`)
                    .addTo(map);
            });
        }

        function searchStations(field) {
            const input = document.getElementById(field).value.toLowerCase();
            const suggestions = nmmtStops.filter(stop => 
                stop.name.toLowerCase().includes(input)
            ).slice(0, 5);

            const suggestionHTML = suggestions.map(stop => 
                `<div class="suggestion-item" onclick="selectStation('${field}', '${stop.name}', ${stop.lat}, ${stop.lng})">
                    ${stop.name}
                </div>` 
            ).join('');

            document.getElementById(field + 'Suggestions').innerHTML = suggestionHTML;
        }

        function selectStation(field, name, lat, lng) {
            document.getElementById(field).value = name;
            document.getElementById(field + 'Suggestions').innerHTML = '';

            // Add temporary marker for selected station
            L.marker([lat, lng], {color: 'red', riseOnHover: true})
                .bindPopup(`<b>Selected ${field}:</b> ${name}`)
                .addTo(map)
                .openPopup();
        }

        function findBuses() {
            const departure = document.getElementById('departure').value;
            const destination = document.getElementById('destination').value;

            // Clear previous route
            if(routingControl) {
                map.removeControl(routingControl);
            }

            // Find coordinates for selected locations
            const depStop = nmmtStops.find(s => s.name === departure);
            const destStop = nmmtStops.find(s => s.name === destination);

            if (depStop && destStop) {
                routingControl = L.Routing.control({
                    waypoints: [
                        L.latLng(depStop.lat, depStop.lng),
                        L.latLng(destStop.lat, destStop.lng)
                    ],
                    routeWhileDragging: true
                }).addTo(map);
            }

            // Display available bus routes
            let availableRoutesHTML = '';
            for (const [route, details] of Object.entries(busRoutes)) {
                availableRoutesHTML += `<div class="list-group-item">
                                            <strong>${route}</strong><br>
                                            Stops: ${details.stops.join(', ')}<br>
                                            Timings: ${details.timings.join(', ')}<br>
                                            Frequency: ${details.frequency}
                                        </div>`;
            }

            document.getElementById('busResults').innerHTML = availableRoutesHTML;
        }

        // Initialize map on page load
        initMap();
    </script>

    </script>
